<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPHEREx Telegram WebApp Explorer</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Three.js for 3D Sky Dome -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Chart.js for Spectrum -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151922;
      --accent: #38ef7d;
      --accent-blue: #11998e;
      --text: #ffffff;
      --subtext: #9aa0a6;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }
    header {
      padding: 12px 16px;
      background: rgba(21, 25, 34, 0.8);
      backdrop-filter: blur(10px);
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .logo i { color: #38ef7d; }
    .user-badge { font-size: 12px; color: var(--subtext); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 12px; }

    /* 3D Sky Canvas Container */
    #canvas-container {
      width: 100vw;
      height: 55vh;
      position: relative;
      background: #000;
      margin-top: 48px;
      cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }

    .crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 24px; height: 24px;
      border: 2px solid rgba(56, 239, 125, 0.8);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }
    .crosshair::before, .crosshair::after {
      content: ''; position: absolute; background: rgba(56, 239, 125, 0.8);
    }
    .crosshair::before { top: 10px; left: -8px; width: 4px; height: 2px; }
    .crosshair::after { top: -8px; left: 10px; width: 2px; height: 4px; }

    .sky-hud {
      position: absolute;
      bottom: 12px; left: 12px; right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: monospace;
      font-size: 12px;
    }
    .hud-coords { color: #38ef7d; }

    /* Action Panel */
    .action-panel {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-main {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent));
      color: #000;
      font-weight: 700;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s;
    }
    .btn-main:active { transform: scale(0.98); }
    .btn-sub {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Modal / Analysis View */
    .analysis-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      overflow-y: auto;
      padding: 16px;
    }
    .analysis-modal.active { display: block; }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .close-btn { font-size: 20px; color: var(--subtext); cursor: pointer; }

    .view-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab {
      flex: 1; padding: 8px; text-align: center; background: rgba(255,255,255,0.05);
      border-radius: 8px; font-size: 12px; cursor: pointer; color: var(--subtext);
    }
    .tab.active { background: var(--accent); color: #000; font-weight: bold; }

    .viewport-box {
      width: 100%; height: 260px;
      background: #000; border-radius: 12px;
      position: relative; overflow: hidden;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .viewport-canvas { width: 100%; height: 100%; }

    .chart-box {
      background: var(--card); border-radius: 12px; padding: 12px;
      margin-top: 16px; border: 1px solid var(--border);
    }

    .preset-list {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    }
    .preset-chip {
      background: rgba(255,255,255,0.06); padding: 6px 12px; border-radius: 20px;
      font-size: 12px; white-space: nowrap; cursor: pointer; border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo"><i class="fa-solid fa-telescope"></i> SPHEREx SkyMap</div>
    <div class="user-badge" id="user-display">Telegram User</div>
  </header>

  <!-- 3D Sky Dome Viewport -->
  <div id="canvas-container">
    <div class="crosshair"></div>
    <div class="sky-hud">
      <div><i class="fa-solid fa-location-crosshairs"></i> <span class="hud-coords" id="coords-display">RA: 08h 55m | Dec: -07° 14'</span></div>
      <div>FOV: 1.5°</div>
    </div>
  </div>

  <div class="action-panel">
    <div class="preset-list">
      <div class="preset-chip" onclick="jumpTo(133.79, -7.245, 'WISE 0855')">🌌 WISE 0855 (Коричневий карлик)</div>
      <div class="preset-chip" onclick="jumpTo(269.45, 4.69, 'Barnard Star')">⭐ Зорка Барнарда</div>
      <div class="preset-chip" onclick="jumpTo(330.2, -56.7, 'Epsilon Indi B')">🪐 Epsilon Indi B</div>
    </div>

    <button class="btn-main" onclick="openAnalysis()">
      <i class="fa-solid fa-play"></i> Дослідити цю ділянку неба
    </button>

    <button class="btn-sub" onclick="subscribeRegion()">
      <i class="fa-solid fa-bell"></i> Підписатися на зміни кажні 6 місяців
    </button>
  </div>

  <!-- Analysis Modal -->
  <div class="analysis-modal" id="analysisModal">
    <div class="modal-header">
      <h3 id="modal-title">Аналіз ділянки</h3>
      <i class="fa-solid fa-xmark close-btn" onclick="closeAnalysis()"></i>
    </div>

    <div class="view-tabs">
      <div class="tab active" onclick="setMode('blink')">🎬 Анімація (Blink)</div>
      <div class="tab" onclick="setMode('diff')">➖ Різниця (Diff)</div>
      <div class="tab" onclick="setMode('coadd')">🥞 Co-Add (Стек)</div>
    </div>

    <div class="viewport-box">
      <canvas id="blinkCanvas" class="viewport-canvas"></canvas>
    </div>

    <div style="margin-top: 10px; font-size: 12px; color: var(--subtext); text-align: center;" id="epochText">
      Епоха: May 2025 (SPHEREx Survey 1)
    </div>

    <div class="chart-box">
      <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px;">📊 Інфрачервоний спектр (102 канали SPHEREx)</div>
      <canvas id="spectrumChart" height="150"></canvas>
    </div>
  </div>

  <script>
    // Telegram Web App Initialization
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('user-display').innerText = '@' + tg.initDataUnsafe.user.username;
      }
    }

    // 3D Sky Dome Setup with Three.js
    let scene, camera, renderer, stars;
    let currentRA = 133.79, currentDec = -7.245;
    let isDragging = false, previousMousePosition = { x: 0, y: 0 };

    function init3DSky() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 0.1);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      // Create Starfield Sphere
      const starGeometry = new THREE.BufferGeometry();
      const starCount = 3000;
      const positions = new Float32Array(starCount * 3);
      const colors = new Float32Array(starCount * 3);

      for(let i = 0; i < starCount; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 100;

        positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i*3+2] = r * Math.cos(phi);

        colors[i*3] = 0.8 + Math.random()*0.2;
        colors[i*3+1] = 0.8 + Math.random()*0.2;
        colors[i*3+2] = 1.0;
      }

      starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const starMaterial = new THREE.PointsMaterial({ size: 1.2, vertexColors: true });
      stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);

      // Drag controls for 1st person sky rotation
      container.addEventListener('mousedown', e => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
      container.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;
        
        stars.rotation.y += deltaX * 0.003;
        stars.rotation.x += deltaY * 0.003;

        previousMousePosition = { x: e.clientX, y: e.clientY };
        updateCoordinates();
      });
      window.addEventListener('mouseup', () => isDragging = false);

      // Touch events for mobile
      container.addEventListener('touchstart', e => {
        if(e.touches.length === 1) {
          isDragging = true;
          previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      });
      container.addEventListener('touchmove', e => {
        if (!isDragging || e.touches.length !== 1) return;
        const deltaX = e.touches[0].clientX - previousMousePosition.x;
        const deltaY = e.touches[0].clientY - previousMousePosition.y;

        stars.rotation.y += deltaX * 0.003;
        stars.rotation.x += deltaY * 0.003;

        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        updateCoordinates();
      });
      container.addEventListener('touchend', () => isDragging = false);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    function updateCoordinates() {
      // Calculate pseudo RA/Dec based on rotation
      currentRA = ((stars.rotation.y * 180 / Math.PI % 360) + 360) % 360;
      currentDec = Math.max(-90, Math.min(90, stars.rotation.x * 180 / Math.PI));
      
      const raHours = Math.floor(currentRA / 15);
      const raMin = Math.floor((currentRA % 15) * 4);
      document.getElementById('coords-display').innerText = `RA: ${raHours}h ${raMin}m | Dec: ${currentDec.toFixed(1)}°`;
    }

    function jumpTo(ra, dec, name) {
      stars.rotation.y = (ra * Math.PI) / 180;
      stars.rotation.x = (dec * Math.PI) / 180;
      updateCoordinates();
    }

    // Modal & Canvas Blink Logic
    let currentMode = 'blink';
    let blinkInterval = null;
    let currentEpoch = 0;
    let spectrumChart = null;

    function openAnalysis() {
      document.getElementById('analysisModal').classList.add('active');
      startBlinkAnimation();
      initSpectrumChart();
    }

    function closeAnalysis() {
      document.getElementById('analysisModal').classList.remove('active');
      if (blinkInterval) clearInterval(blinkInterval);
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      renderViewport();
    }

    function startBlinkAnimation() {
      if (blinkInterval) clearInterval(blinkInterval);
      blinkInterval = setInterval(() => {
        if (currentMode === 'blink') {
          currentEpoch = (currentEpoch + 1) % 4;
          renderViewport();
        }
      }, 500);
    }

    function renderViewport() {
      const canvas = document.getElementById('blinkCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;

      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Draw background stars
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(cx - 50, cy - 40, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 60, cy + 50, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - 80, cy + 30, 2.5, 0, Math.PI * 2); ctx.fill();

      // Moving Object (e.g. Fast Moving Brown Dwarf)
      const epochs = [
        { x: cx - 30, y: cy - 20, label: 'May 2025' },
        { x: cx - 10, y: cy - 10, label: 'Nov 2025' },
        { x: cx + 10, y: cy + 0, label: 'May 2026' },
        { x: cx + 30, y: cy + 10, label: 'Nov 2026' }
      ];

      if (currentMode === 'blink') {
        const ep = epochs[currentEpoch];
        ctx.fillStyle = '#38ef7d';
        ctx.beginPath(); ctx.arc(ep.x, ep.y, 4, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#38ef7d'; ctx.lineWidth = 1;
        ctx.strokeRect(ep.x - 8, ep.y - 8, 16, 16);
        document.getElementById('epochText').innerText = `Епоха ${currentEpoch + 1}/4: ${ep.label}`;
      } else if (currentMode === 'diff') {
        // Render Dipole
        ctx.fillStyle = '#ff4b4b'; ctx.beginPath(); ctx.arc(epochs[0].x, epochs[0].y, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#38ef7d'; ctx.beginPath(); ctx.arc(epochs[3].x, epochs[3].y, 4, 0, Math.PI * 2); ctx.fill();
        document.getElementById('epochText').innerText = `Різниця між травнем 2025 та листопадом 2026 (Червоне/Зелене диполь)`;
      } else if (currentMode === 'coadd') {
        epochs.forEach(ep => {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.beginPath(); ctx.arc(ep.x, ep.y, 4, 0, Math.PI * 2); ctx.fill();
        });
        document.getElementById('epochText').innerText = `Накладення (Co-add) всіх 4 епох спостережень`;
      }
    }

    function initSpectrumChart() {
      if (spectrumChart) spectrumChart.destroy();
      const ctx = document.getElementById('spectrumChart').getContext('2d');
      
      const labels = Array.from({length: 30}, (_, i) => (0.75 + i * 0.14).toFixed(2) + 'µm');
      const data = labels.map((_, i) => Math.sin(i * 0.4) * 20 + 50 + Math.random() * 5);

      spectrumChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Потік (mJy)',
            data: data,
            borderColor: '#38ef7d',
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#9aa0a6', font: { size: 9 } } },
            y: { ticks: { color: '#9aa0a6', font: { size: 9 } } }
          }
        }
      });
    }

    function subscribeRegion() {
      if (tg) {
        tg.sendData(JSON.stringify({
          action: 'subscribe',
          ra: currentRA.toFixed(4),
          dec: currentDec.toFixed(4)
        }));
        tg.showAlert(`✅ Успішно підписано на сповіщення!\nКоординати: RA ${currentRA.toFixed(2)}, Dec ${currentDec.toFixed(2)}.\nМи надішлемо вам повідомлення у чат, коли SPHEREx зробить наступний обліт цієї ділянки (через 6 місяців).`);
      } else {
        alert("Підписка збережена! У Telegram ви отримаєте сповіщення через 6 місяців.");
      }
    }

    window.onload = () => {
      init3DSky();
    };
  </script>
</body>
</html>
